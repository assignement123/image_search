version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: leaf_vector_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: leaf_db
    ports:
      - "5433:5432"
    volumes:
      - leaf_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:                    
    build: .                   
    container_name: leaf_app
    restart: always
    ports:
      - "5001:5001"           
    volumes:
      - .:/app                
    environment:
      - DATABASE_URL=postgresql://admin:admin@db:5432/leaf_db
    depends_on:
      - db

volumes:
  leaf_db_data: